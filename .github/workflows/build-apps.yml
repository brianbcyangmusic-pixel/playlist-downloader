name: Build apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS menu bar app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build app
        run: bash scripts/build_macos_app.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlaylistDownloader-macOS
          path: dist/PlaylistDownloader-macOS.zip

  windows:
    name: Windows tray app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build app
        shell: pwsh
        run: ./launcher/windows/build.ps1
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlaylistDownloader-Windows
          path: dist/PlaylistDownloader-Windows-x64.zip

  release:
    name: Publish GitHub Release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/PlaylistDownloader-macOS/PlaylistDownloader-macOS.zip
            artifacts/PlaylistDownloader-Windows/PlaylistDownloader-Windows-x64.zip
          generate_release_notes: true
