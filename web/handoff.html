<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finishing sign-in — Playlist Downloader</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:#0f1115; color:#e6e9ef;
         font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .box { max-width:420px; padding:34px 30px; background:#171a21;
         border:1px solid #2a2f3a; border-radius:14px; text-align:center; }
  .dot { width:44px; height:44px; border-radius:50%; margin:0 auto 16px;
         display:grid; place-items:center; background:#6ea8fe; color:#0f1115;
         font-size:22px; font-weight:700; }
  .dot.ok { background:#3ddc97; } .dot.bad { background:#ff6b6b; }
  h1 { font-size:18px; margin:0 0 8px; }
  p { margin:0; color:#8b93a7; font-size:14px; }
  b { color:#e6e9ef; }
  .spin { width:16px; height:16px; border:2px solid #2b3a4f;
          border-top-color:#6ea8fe; border-radius:50%; margin:0 auto 14px;
          animation:s 1s linear infinite; }
  @keyframes s { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="box">
  <div class="spin" id="spin"></div>
  <div class="dot" id="dot" hidden>✓</div>
  <h1 id="title">Finishing sign-in…</h1>
  <p id="message">Handing the session back to the app.</p>
</div>

<script>
/* The browser page posted the Firebase session in the URL *fragment* (never
 * sent to any server, never in a Referer header). Read it, forward it to the
 * loopback app, then erase it from the address bar so it cannot linger in
 * history or be copied out of the URL bar. */
(function () {
  "use strict";

  var params = new URLSearchParams(window.location.hash.replace(/^#/, ""));
  var payload = {
    state: params.get("state") || "",
    id_token: params.get("id_token") || "",
    refresh_token: params.get("refresh_token") || "",
    email: params.get("email") || "",
    uid: params.get("uid") || "",
    name: params.get("name") || "",
    expires_in: Number(params.get("expires_in") || 3600)
  };

  // Scrub immediately — before any await — so the tokens never sit in the URL.
  try { history.replaceState(null, "", "/auth/handoff"); } catch (e) {}

  function finish(ok, message) {
    document.getElementById("spin").hidden = true;
    var dot = document.getElementById("dot");
    dot.hidden = false;
    dot.className = "dot " + (ok ? "ok" : "bad");
    dot.textContent = ok ? "✓" : "!";
    document.getElementById("title").textContent = ok ? "Signed in" : "Sign-in problem";
    document.getElementById("message").textContent = message;
  }

  if (!payload.state || !payload.id_token) {
    finish(false, "The sign-in page did not send a session. Go back to the app and try again.");
    return;
  }

  fetch("/api/auth/handoff", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (res && res.ok) {
        var who = (res.auth && res.auth.user && res.auth.user.email) || payload.email;
        finish(true, "Signed in as " + who + ". You can close this tab and return to the app.");
      } else {
        finish(false, (res && res.error) || "The app could not complete the sign-in.");
      }
    })
    .catch(function () {
      finish(false, "Could not reach the app. Is it still running?");
    });
})();
</script>
</body>
</html>
