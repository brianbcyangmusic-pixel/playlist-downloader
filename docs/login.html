<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Playlist Downloader</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬇</text></svg>">
<style>
  :root { --bg:#0f1115; --elev:#171a21; --elev2:#1e222b; --border:#2a2f3a;
          --text:#e6e9ef; --muted:#8b93a7; --accent:#6ea8fe; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif;
  }
  .card {
    width: 100%; max-width: 380px; background: var(--elev);
    border: 1px solid var(--border); border-radius: 14px; padding: 28px;
    box-shadow: 0 10px 40px rgba(0,0,0,.4); text-align: center;
  }
  .brand { display: flex; align-items: center; gap: 12px; text-align: left; margin-bottom: 18px; }
  .logo {
    width: 40px; height: 40px; display: grid; place-items: center; flex: none;
    background: linear-gradient(140deg, var(--accent), #8b7bff);
    border-radius: 10px; font-size: 20px; color: #0b0d12;
  }
  h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .muted { color: var(--muted); font-size: 12px; display: block; }
  button {
    width: 100%; margin-top: 16px; font: inherit; font-size: 14px; cursor: pointer;
    color: #fff; background: #3d7bfd; border: 1px solid transparent;
    border-radius: 8px; padding: 11px 14px;
  }
  button:hover { background: #4d88ff; }
  button:disabled { opacity: .6; cursor: default; }
  .msg { margin-top: 14px; font-size: 13px; color: #ff9b9b; min-height: 18px; }
  .msg.ok { color: #3ddc97; }
  .spin {
    width: 16px; height: 16px; border: 2px solid #2b3a4f; border-top-color: var(--accent);
    border-radius: 50%; margin: 16px auto 0; animation: s 1s linear infinite;
  }
  @keyframes s { to { transform: rotate(360deg); } }
  p.note { color: var(--muted); font-size: 12px; margin: 16px 0 0; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="logo">⬇</div>
    <div>
      <h1>Playlist Downloader</h1>
      <span class="muted">Finish sign-in in your browser</span>
    </div>
  </div>

  <p class="muted" style="text-align:left">
    Sign in with the Google account you use in the app. The desktop app will
    take over as soon as this finishes.
  </p>

  <button id="go">Continue with Google</button>
  <div class="spin" id="spin" hidden></div>
  <div class="msg" id="msg" role="status"></div>
  <p class="note">Nothing is stored on this page. The session is handed straight
    back to the app on your computer.</p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script>
(function () {
  "use strict";

  var CONFIG = {
    apiKey: "AIzaSyCSCx1rMiR2bQKFH6PXwGRLUxg0__pkmdo",
    authDomain: "playlist-downloader-99ad0.firebaseapp.com",
    projectId: "playlist-downloader-99ad0",
    storageBucket: "playlist-downloader-99ad0.firebasestorage.app",
    messagingSenderId: "800139508246",
    appId: "1:800139508246:web:5032688053764cd0871337"
  };

  var params = new URLSearchParams(location.search);
  var port = parseInt(params.get("port") || "", 10);
  var state = params.get("state") || "";
  var go = document.getElementById("go");
  var spin = document.getElementById("spin");
  var msg = document.getElementById("msg");

  function fail(text) {
    spin.hidden = true;
    go.hidden = false;
    go.disabled = false;
    go.textContent = "Try again";
    msg.textContent = text;
  }

  if (!state || !(port > 0 && port < 65536)) {
    go.hidden = true;
    msg.textContent = "This page must be opened from the app (Settings → Account). Open the app and press “Sign in with Google”.";
    return;
  }

  firebase.initializeApp(CONFIG);
  var auth = firebase.auth();

  go.addEventListener("click", function () {
    msg.textContent = "";
    go.hidden = true;
    spin.hidden = false;
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).then(function (result) {
      var user = result.user;
      var refresh = user.refreshToken ||
        (user.stsTokenManager && user.stsTokenManager.refreshToken) || "";
      return user.getIdToken().then(function (idToken) {
        if (!idToken || !refresh) throw new Error("Google did not return a usable session.");
        var payload = new URLSearchParams({
          state: state,
          id_token: idToken,
          refresh_token: refresh,
          email: user.email || "",
          uid: user.uid || "",
          name: user.displayName || "",
          expires_in: "3600"
        });
        spin.hidden = true;
        msg.className = "msg ok";
        msg.textContent = "Signed in as " + (user.email || "your account") + ". Returning to the app…";
        // Fragment: never sent to a server, never in a Referer header.
        location.replace("http://127.0.0.1:" + port + "/auth/handoff#" + payload.toString());
      });
    }).catch(function (err) {
      var code = (err && err.code) || "";
      if (code === "auth/popup-closed-by-user" || code === "auth/cancelled-popup-request") {
        fail("Sign-in cancelled.");
      } else if (code === "auth/unauthorized-domain") {
        fail("This domain is not allowed in Firebase Authentication.");
      } else {
        fail((err && err.message) || "Google sign-in failed.");
      }
    });
  });
})();
</script>
</body>
</html>
